name: Python CI & Auto PR to Main

# NEH-273: this used to fire ONLY on pushes to `dev`, so a PR opened against
# `main` from any other branch reported zero checks and could merge with nothing
# having run (that is how #5, the roz-remembers -> stonedog-remembers rename,
# had to be merged on a locally-run gate). The `dev` coverage is unchanged; the
# `pull_request` and `push: main` triggers are additive.
on:
  pull_request:
    branches:
      - main # Gate every PR that targets 'main'
  push:
    branches:
      - main # ...and the post-merge state of 'main' itself
      - dev # This workflow runs when changes are pushed to the 'dev' branch

# A merge into `main` would otherwise run the gate twice concurrently (once for
# the PR's final state, once for the push). Never cancel a run on `main`: its
# result is the record of what the trunk actually does.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build_and_test:
    name: Build & Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest # Use a standard Ubuntu runner

    # NEH-281: the single `python-version: '3.10'` pin matched nothing in
    # particular -- `pyproject.toml` declares `requires-python = ">=3.9,<4.0"`,
    # so 3.10 was neither the floor nor the ceiling of what this package claims
    # to support. A matrix over the two ends is the honest statement of that
    # range; both were run locally against this commit (40 passed, 98.37% on
    # 3.9 and 98.38% on 3.13). The interior versions are not enumerated on
    # purpose: this is a pure-Python, dependency-free library, so a break that
    # hits only 3.11 while 3.9 and 3.13 stay green is not a failure mode it has.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']

    steps:
      # No explicit `ref`. The default is right for every trigger: the pushed
      # commit on a push, and the PR's merge commit (the state that will exist
      # on `main` after merging) on a pull_request. The previous explicit
      # `ref: ${{ github.sha }}` was only ever equivalent to the default.
      - name: Checkout code
        uses: actions/checkout@v4

      # Poetry runs on THIS interpreter, not the one under test. Poetry 2.x
      # requires Python >= 3.10, so installing it under the 3.9 matrix leg dies
      # with "Poetry installation failed" before a single test runs -- the trap
      # stonedog-logs hit on its own first hosted run.
      - name: Set up Python for Poetry
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      # The interpreter under test, installed second so Poetry is already in
      # place, then handed to Poetry explicitly by absolute path. This is what
      # replaces the deleted `Configure Poetry for PATH` step: that step ran
      # before any virtualenv existed, so `poetry env info -p` printed an empty
      # string and it appended the literal `/bin` to $GITHUB_PATH. $GITHUB_PATH
      # entries are PREPENDED, so `/bin/python3` -- the runner's system 3.12 --
      # shadowed the setup-python shim for every later step and Poetry built
      # its venv from that. The workflow said 3.10 and the suite ran on 3.12.3.
      - name: Set up the interpreter under test
        uses: actions/setup-python@v5
        id: target-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the project venv on the interpreter under test
        run: poetry env use "${{ steps.target-python.outputs.python-path }}"

      # The evidence, in the run log, that the pin is real. A reasoning
      # argument about the YAML is exactly what failed to catch NEH-281: the
      # file said one thing and the runner did another for months. `poetry run
      # python -VV` must report ${{ matrix.python-version }}; pytest's coverage
      # header then says the same thing independently.
      - name: Report the interpreters in play
        run: |
          echo "PATH python:      $(python -VV 2>&1)"
          echo "poetry venv:      $(poetry run python -VV 2>&1)"
          echo "expected (matrix): ${{ matrix.python-version }}"

      - name: Install project in editable mode
        run: poetry install --with dev # with dev installs development dependencies

      # No PYTHONPATH here or in the environment: `pyproject.toml` already sets
      # `pythonpath = ["src"]` under [tool.pytest.ini_options], so the deleted
      # `Set PYTHONPATH for src directory` step and the `PYTHONPATH=src` prefix
      # were both redundant.
      - name: Run tests with pytest
        run: poetry run pytest # Execute your tests using Poetry's run command

  create_pr_and_merge:
    name: Create PR & Merge to Main
    runs-on: ubuntu-latest
    needs: build_and_test
    # Only run if build_and_test passed AND this is a push to 'dev'. Without the
    # event guard the new triggers would make this open a dev->main PR on every
    # pull request and on every push to main -- and it needs GH_ACTIONS_PAT, so
    # it would also fail the check for anyone whose fork/branch cannot see the
    # secret. This job is the dev->main automation only; it is not the gate.
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0 
          token: ${{ secrets.GH_ACTIONS_PAT }} 

      - name: Fetch and ensure main is up-to-date
        run: |
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin main # Fetch main branch from origin
          git branch -f main origin/main 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for differences between dev and main (Bulletproof)
        id: check_diff
        run: |
          DEV_SHA=$(git rev-parse origin/dev)
          MAIN_SHA=$(git rev-parse origin/main)

          echo "DEBUG: Remote origin/dev SHA: $DEV_SHA"
          echo "DEBUG: Remote origin/main SHA: $MAIN_SHA"

          # Check if dev is ahead of main (meaning main's HEAD is an ancestor of dev's HEAD)
          if [ "$(git merge-base "$MAIN_SHA" "$DEV_SHA")" = "$MAIN_SHA" ]; then
            # If main is an ancestor of dev, then dev has commits main doesn't have
            NUM_COMMITS_AHEAD=$(git rev-list --right-only --count "$MAIN_SHA".."$DEV_SHA")
            if [ "$NUM_COMMITS_AHEAD" -gt 0 ]; then
              echo "::notice::Branch 'dev' is ahead of 'main' by $NUM_COMMITS_AHEAD commits. PR needed."
              echo "needs_pr=true" >> "$GITHUB_OUTPUT"
            else
              # This case handles if main is an ancestor of dev but there are no new commits (e.g. empty commit or already merged)
              echo "::notice::Branch 'dev' is a descendant of 'main' but has no new content. No PR needed."
              echo "needs_pr=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # If dev is an ancestor of main OR they have diverged (both have unique commits)
            # In this workflow, if dev is an ancestor of main, it means main already merged dev.
            echo "::notice::Branch 'dev' is not ahead of 'main' with new commits (it might be an ancestor or diverged)."
            echo "needs_pr=false" >> "$GITHUB_OUTPUT"
          fi
        # Add a default output to needs_pr if the if/else conditions don't set it (safety)
        # This can happen if the script exits early or if the branch comparison logic is complex.
        # You might not strictly need this if your logic covers all paths, but it's good practice.
        # This will be automatically set by `echo "needs_pr=true/false" >> $GITHUB_OUTPUT`

      - name: Create Pull Request (using gh CLI)
        if: steps.check_diff.outputs.needs_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: |
          PR_TITLE="Automated: Merge dev into main"
          PR_BODY="This is an automated pull request to merge changes from \`dev\` into \`main\` after all CI tests passed."
          PR_EXISTS=$(gh pr list --base main --head dev --json number --jq '.[0].number' || echo "")

          if [ -z "$PR_EXISTS" ]; then
            echo "No existing PR found. Creating new PR from dev to main."
            NEW_PR_URL=$(gh pr create --base main --head dev --title "$PR_TITLE" --body "$PR_BODY" --draft --repo ${{ github.repository }})
            echo "New PR created: $NEW_PR_URL"
            # Extract PR number from URL
            PR_NUMBER=$(echo "$NEW_PR_URL" | sed -n 's/.*pull\/\([0-9]*\).*/\1/p')
            echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "Existing PR #$PR_EXISTS found. Will try to update or enable auto-merge."
            echo "PR_NUMBER=$PR_EXISTS" >> "$GITHUB_OUTPUT"
            # Optional: You can add gh pr edit or gh pr ready if it's a draft
            # gh pr edit "$PR_EXISTS" --title "$PR_TITLE" --body "$PR_BODY"
          fi

      - name: Enable auto-merge on the Pull Request
        if: steps.create_pull_request.outputs.PR_NUMBER != '' # Only run if a PR number was successfully determined
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: |
          PR_NUMBER=${{ steps.create_pull_request.outputs.PR_NUMBER }}
          echo "Attempting to enable auto-merge for PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --auto --merge --repo ${{ github.repository }}
          echo "Auto-merge command executed for PR #$PR_NUMBER"

      - name: Close the Pull Request (if merged successfully)
        # This is primarily for logging/cleanup if you need explicit closing logic.
        # gh pr merge --auto should handle the closing when it successfully merges.
        if: success() && steps.create_pull_request.outputs.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: |
          PR_NUMBER=${{ steps.create_pull_request.outputs.PR_NUMBER }}
          echo "Checking if PR #$PR_NUMBER is closed..."
          PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state' --repo ${{ github.repository }})
          if [ "$PR_STATE" = "MERGED" ] || [ "$PR_STATE" = "CLOSED" ]; then
            echo "PR #$PR_NUMBER is already merged or closed."
          else
            echo "PR #$PR_NUMBER is still open. Auto-merge might be pending or failed."
          fi